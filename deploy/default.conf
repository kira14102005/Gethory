server {
        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;

        server_name kira14102005.dpdns.org www.kira14102005.dpdns.org;

        location / {
            root /var/www/html;
            try_files $uri /index.html;
        }

        location /socket.io {
                proxy_pass http://backend:3000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_cache_bypass $http_upgrade;
          }

        location /api {
            proxy_pass http://backend:3000;
        }

        location /storage {
            proxy_pass http://backend:3000;
        }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.kira14102005.dpdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.kira14102005.dpdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}server {
    if ($host = www.kira14102005.dpdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = kira14102005.dpdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        listen 80 default_server;
        listen [::]:80 default_server;

        server_name kira14102005.dpdns.org www.kira14102005.dpdns.org;
    return 404; # managed by Certbot




}